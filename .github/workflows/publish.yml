name: Publish

# A tag v<version> publishes that version to PyPI, through PyPI's trusted publishing: PyPI
# trusts this workflow, in the `pypi` environment, so no token is stored anywhere.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write  # what trusted publishing signs in with
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The tag names the version being published
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, but pyproject.toml says $version"; exit 1; }
      - run: python -m pip install build twine -e ".[images,serial,test]"
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: pypa/gh-action-pypi-publish@v1.12.4
