[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nextion-tools"
version = "0.1.0"
description = "Read and edit Nextion Editor projects, fonts and TFTs, and emulate the display they run on"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []
authors = [{ name = "James Mulcahy" }]
keywords = ["nextion", "hmi", "tft", "emulator", "display", "esp32"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/jamesmulcahy/nextion-tools"
Source = "https://github.com/jamesmulcahy/nextion-tools"
Issues = "https://github.com/jamesmulcahy/nextion-tools/issues"

[project.optional-dependencies]
# Fonts, pictures and picture swaps in TFTs. Reading HMIs and the emulator need neither.
images = ["numpy", "pillow"]
serial = ["pyserial>=3.5"]
test = ["pytest>=8", "pytest-timeout>=2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "tests/emu"]
timeout = 60
